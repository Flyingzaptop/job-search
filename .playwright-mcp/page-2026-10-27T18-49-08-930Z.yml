                  - paragraph [ref=e200]: "Współadministratorzy powołali Inspektora Ochrony Danych osobowych, Pana Mariusza Zajkiewicza, z którym można się skontaktować przy pomocy poczty elektronicznej wysyłając korespondencję na adres email lub tradycyjną poczta na adres korespondencyjny podany poniżej z dopiskiem „RODO”:"
