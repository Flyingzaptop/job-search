                  - paragraph [ref=e232]:
                    - text: Państwa dane osobowe związane z rekrutacją będą przetwarzane przez okres rekrutacji jednak nie dłużej niż
                    - strong [ref=e233]: 12 miesięcy
                    - text: od dnia wysłania Państwa danych do systemu. Pozostałe dane będą przetwarzane na podstawie prawa przez okres trwania współpracy.
                  - paragraph [ref=e234]:
                    - text: Jeśli uczestniczą Państwo w procesie rekrutacji z polecenia pracownika jednego ze Współadministratorów, Państwa dane będą przetwarzane przez kolejne
                    - strong [ref=e235]: 12 miesięcy (razem 24 miesiące)
                    - text: od momentu, kiedy Twoja kandydatura została przedstawiona przez pracownika Współadministratora.
                  - paragraph [ref=e236]:
                    - text: W przypadku wyrażenia zgody na przetwarzanie danych osobowych w celu uczestnictwa w przyszłych procesach rekrutacji prowadzonych przez Współadministratora, Państwa dane osobowe będą zapisane w bazie i przechowywane przez okres
                    - strong [ref=e237]: 24 miesięcy
                    - text: od dnia zakończenia okresu określonego w ust. 6 klauzuli informacyjnej (
                    - strong [ref=e238]: razem 36 miesięcy
                    - text: ).
                  - paragraph [ref=e239]: Jeśli nie są Państwo naszymi kontrahentami lub partnerami biznesowym, przechowujemy dane zebrane wyłącznie w związku z bieżącym kontaktem, przez okres kilku tygodni (niektóre pliki cookie), maksymalnie przez 5 lat (bardziej szczegółowe zapytania i rozmowy, które mogą być istotne dla naszego przyszłego kontaktu), w zależności od kategorii poszczególnych informacji.
                  - paragraph [ref=e240]: Jeśli są Państwo naszymi kontrahentami lub partnerami biznesowym, przechowujemy dane zebrane wyłącznie w związku z realizacją umowy przez okres 5 lat od końca roku rozliczeniowego w którym zakończyła się współpraca.
                  - paragraph [ref=e241]: Odbiorcą Państwa danych osobowych będą podmioty współpracujące ze Współadministratorami w zakresie wsparcia IT, wsparcia prawnego oraz podmioty publiczne m.in. ZUS, US.
                  - paragraph [ref=e242]: Posiadają Państwo prawo dostępu do treści swoich danych oraz prawo ich sprostowania, usunięcia, ograniczenia przetwarzania, prawo wniesienia sprzeciwu, jeżeli przetwarzanie danych osobowych odbywa się na podstawie zgody, a także prawo do przenoszenia danych.
