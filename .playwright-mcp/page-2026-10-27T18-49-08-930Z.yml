                  - list [ref=e206]:
                    - listitem [ref=e207]: przeprowadzenia procesu rekrutacji na podstawie art. 6 ust. 1 lit. b RODO (podjęcie działań na żądanie osoby, której dane dotyczą, przed zawarciem umowy) oraz art. 22 1 Kodeksu pracy;
                    - listitem [ref=e208]: przeprowadzenia procesu przyszłych rekrutacji na podstawie art. 6 ust. 1 lit. a RODO (zgoda) jeśli otrzymamy od Państwa więcej danych niż wymagane przepisami prawa;
                    - listitem [ref=e209]: przeprowadzenia części procesu rekrutacji w sposób automatyczny na podstawie art. 6 ust. 1 lit. a RODO (zgoda) na podstawie podanych informacji przez kandydata;
                    - listitem [ref=e210]: przesyłania informacji marketingowych na podstawie art. 6 ust. 1 lit. a RODO (zgoda) informując o nowych rozwiązaniach i działaniach spółki;
                    - listitem [ref=e211]: przesyłania informacji handlowych drogą elektroniczną na podstawie art. 6 ust. 1 lit. a RODO (zgoda) w oparciu o art. 398 Pr. Komunikacji elektronicznej;
                    - listitem [ref=e212]: przetwarzanie danych osobowych w postaci wizerunku na podstawie art. 6 ust. 1 lit. a RODO (zgoda) w oparciu o art. 81 Pr. autorskiego i praw pokrewnych;
                    - listitem [ref=e213]: przetwarzania danych osobowych pracowników i kontrahentów współpracujących z Administratorem na podstawie art. 6 ust. 1 lit. c RODO (niezbędne do wypełnienia obowiązku prawnego związanego z nawiązaniem współpracy i realizacją umowy, określonych przepisami kodeksu pracy i kodeksu cywilnego).
                    - listitem [ref=e214]: przetwarzania danych osobowych pracowników kontrahentów i kontrahentów współpracujących z Administratorem na podstawie art. 6 ust. 1 lit. f RODO (prawnie uzasadniony interes Administratora, związany z nawiązaniem współpracy i realizacją umowy, określonych przepisami kodeksu pracy i kodeksu cywilnego oraz dochodzeniem roszczeń do upływu okresu przedawnienia).
