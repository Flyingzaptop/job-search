                    - text: danych osobowych zawartych w Twoim zgłoszeniu rekrutacyjnym (m.in. w formularzu aplikacyjnym) dla celów prowadzenia rekrutacji na stanowisko wskazane w ogłoszeniu o pracę.
                  - paragraph [ref=e190]: Zgoda obejmuje dane osobowe, które nie zostały wskazane w Kodeksie pracy lub innych przepisach prawa lub nie są niezbędne do podjęcia działań przed zawarciem umowy o pracę lub umowy cywilnoprawnej (np. Twoje zdjęcie, zainteresowania). Dane osobowe wskazane w Kodeksie pracy lub w innych przepisach prawa (m.in. Twoje imię, nazwisko, datę urodzenia, dane kontaktowe, wykształcenie, doświadczenie zawodowe) lub dane niezbędne do podjęcia działań przed zawarciem umowy o pracę lub umowy cywilnoprawnej (np. Twoje oczekiwania finansowe, termin rozpoczęcia pracy/świadczenia usług) przetwarzamy, aby wypełnić ciążący na nas obowiązek prawny (art. 6 ust. 1 lit. c RODO) lub ze względu na ich niezbędność do podjęcia działań przed zawarciem umowy (art. 6 ust. 1 lit. b RODO) i ich podanie będzie konieczne do wzięcia udziału w rekrutacji.
                  - paragraph [ref=e191]: Dodatkowo w celu wzięcia udziału w rekrutacji będziemy Cię prosić o podanie adresu e-mail na formularzu aplikacyjnym, który przetwarzamy w oparciu o nasz prawnie uzasadniony interes (art. 6 ust. 1 lit. f RODO), polegający m.in. na możliwości prowadzenia rekrutacji drogą elektroniczną, sprawnej komunikacji z kandydatami oraz na zapewnieniu prawidłowej identyfikacji kandydata w systemie eRecruiter (adres e-mail jest identyfikatorem kandydata w systemie eRecruiter i jego podanie będzie konieczne do wzięcia udziału w rekrutacji).
                  - paragraph [ref=e192]: Jeżeli nie chcesz, abyśmy przetwarzali dodatkowe dane o Tobie, nie umieszczaj ich w swoich dokumentach, w tym w formularzu aplikacyjnym.
